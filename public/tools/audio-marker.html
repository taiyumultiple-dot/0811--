<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>發音對照校對工具｜臺羅拼音方塊研究所</title>
<!--
  課本錄音的「哪一段是哪個音」校對工具（編輯自用，不是給學生的頁面）。

  網站原本的發音是瀏覽器語音合成，沒有台語語音的裝置會用中文語音硬唸，
  聲調常常是錯的。課本真人錄音是整段的，要讓每個聲母／韻母都能單獨播放，
  就得知道每個音在錄音裡的起訖秒數——這件事只有用耳朵聽得出來。

  這一頁把錄音用靜音自動切成小段（segments.json），你只要聽一段、
  點一個對應的音，就完成一筆。全部標完按「下載對照表」，
  把 JSON 交回來，網站上每個音就會播自己的那一小段。
-->
<style>
  :root{--bg:#FAF7F0;--card:#FFFDF9;--line:#EFE8D8;--text:#2D2A26;--sub:#8A8378;--green:#4E9B5D;--orange:#E4772E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;padding:20px;font-weight:700}
  h1{font-size:20px;margin:0 0 4px}
  p.lead{color:var(--sub);font-size:13px;margin:0 0 16px;line-height:1.8}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  select,button{font-family:inherit;font-weight:900;font-size:14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;cursor:pointer}
  button.main{background:var(--green);color:#fff;border-color:var(--green)}
  button.play{background:var(--orange);color:#fff;border-color:var(--orange)}
  button:active{transform:scale(.96)}
  .panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .seg{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .seg:last-child{border-bottom:0}
  .seg.done{background:#F1F8F2}
  .idx{width:44px;color:var(--sub);font-size:12px}
  .time{width:110px;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
  .tag{min-width:70px;text-align:center;padding:6px 10px;border-radius:10px;background:#fff;border:2px solid var(--line);font-size:14px}
  .tag.set{background:var(--green);color:#fff;border-color:var(--green)}
  .choices{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  .choices button{padding:6px 10px;font-size:13px;border-radius:9px}
  .count{color:var(--sub);font-size:13px}
</style>
</head>
<body>

<h1>🎧 發音對照校對工具</h1>
<p class="lead">
  選一個錄音 → 按 ▶ 聽一小段（大多不到 1 秒）→ 點它對應的音。<br>
  聽不出來或不是單音（例如整句說明）就按「略過」。全部弄完按「下載對照表」，把檔案給我，網站上每個音就會播自己的那一段真人發音。
</p>

<div class="row">
  <select id="track"></select>
  <button class="play" id="playAll">▶ 從頭聽整段</button>
  <button id="stop">■ 停</button>
  <span class="count" id="count"></span>
  <button class="main" id="export">⬇ 下載對照表</button>
</div>

<div class="panel" id="list">載入中…</div>

<audio id="au" preload="auto"></audio>

<script>
(function () {
  var BASE = '../audio/phonics/';
  var au = document.getElementById('au');
  var listEl = document.getElementById('list');
  var trackSel = document.getElementById('track');
  var STORE = 'taigi_audio_marks';

  /* 網站上實際會用到的音，校對時直接點這些按鈕指定 */
  var FINALS = ['a','i','u','e','o','oo','ai','au','ia','iu','ua','ue','ui','ann','inn','unn','enn','onn','m','ng'];
  var INITIALS = ['p','ph','b','m','t','th','n','l','ts','tsh','s','j','k','kh','h','g','ng','零聲母'];
  var TONES = ['第1聲','第2聲','第3聲','第4聲','第5聲','第7聲','第8聲'];

  var segments = {}, marks = {};
  try { marks = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch (e) { marks = {}; }

  function choicesFor(key) {
    if (key === 'finals-overview') return FINALS;
    if (key.indexOf('initial-') === 0) return INITIALS;
    if (key.indexOf('tone-') === 0) return TONES;
    return FINALS.concat(INITIALS);
  }

  function save() {
    localStorage.setItem(STORE, JSON.stringify(marks));
    render();
  }

  var stopAt = null;
  function playRange(a, b) {
    au.src = BASE + trackSel.value + '.mp3';
    au.currentTime = a;
    stopAt = b;
    au.play();
  }
  au.addEventListener('timeupdate', function () {
    if (stopAt !== null && au.currentTime >= stopAt) { au.pause(); stopAt = null; }
  });

  function render() {
    var key = trackSel.value;
    var segs = segments[key] || [];
    var mine = marks[key] || {};
    var opts = choicesFor(key);
    var done = Object.keys(mine).length;
    document.getElementById('count').textContent = '已標 ' + done + ' / ' + segs.length + ' 段';

    listEl.innerHTML = segs.map(function (s, i) {
      var cur = mine[i];
      return '<div class="seg' + (cur ? ' done' : '') + '">' +
        '<span class="idx">#' + (i + 1) + '</span>' +
        '<button class="play" data-play="' + i + '">▶</button>' +
        '<span class="time">' + s[0].toFixed(2) + '–' + s[1].toFixed(2) + ' 秒</span>' +
        '<span class="tag' + (cur ? ' set' : '') + '">' + (cur || '—') + '</span>' +
        '<span class="choices">' +
          opts.map(function (o) { return '<button data-set="' + i + '" data-val="' + o + '">' + o + '</button>'; }).join('') +
          '<button data-set="' + i + '" data-val="">略過</button>' +
        '</span>' +
      '</div>';
    }).join('');
  }

  listEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var key = trackSel.value;
    if (b.dataset.play !== undefined) {
      var s = segments[key][+b.dataset.play];
      playRange(s[0], s[1]);
      return;
    }
    if (b.dataset.set !== undefined) {
      marks[key] = marks[key] || {};
      if (b.dataset.val) marks[key][b.dataset.set] = b.dataset.val;
      else delete marks[key][b.dataset.set];
      save();
    }
  });

  document.getElementById('playAll').addEventListener('click', function () {
    au.src = BASE + trackSel.value + '.mp3';
    au.currentTime = 0; stopAt = null; au.play();
  });
  document.getElementById('stop').addEventListener('click', function () { au.pause(); stopAt = null; });

  /* 匯出成網站直接吃得下的格式：{ 音: { track, start, end } } */
  document.getElementById('export').addEventListener('click', function () {
    var out = {};
    Object.keys(marks).forEach(function (track) {
      Object.keys(marks[track]).forEach(function (i) {
        var label = marks[track][i];
        var seg = segments[track][+i];
        if (!label || !seg) return;
        out[label] = { track: track, start: seg[0], end: seg[1] };
      });
    });
    var blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'pronunciation-marks.json';
    a.click();
  });

  trackSel.addEventListener('change', render);

  fetch(BASE + 'segments.json').then(function (r) { return r.json(); }).then(function (data) {
    segments = data;
    var keys = Object.keys(data).sort(function (a, b) {
      var order = ['finals-overview', 'initials-overview'];
      return (order.indexOf(b) - order.indexOf(a)) || a.localeCompare(b);
    });
    trackSel.innerHTML = keys.map(function (k) {
      return '<option value="' + k + '">' + k + '（' + data[k].length + ' 段）</option>';
    }).join('');
    render();
  }).catch(function () {
    listEl.textContent = '讀不到 segments.json';
  });
})();
</script>
</body>
</html>
